<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD2 Loadouts</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root {
  --bg: #0d0d14;
  --surface: #14141e;
  --surface2: #1a1a28;
  --border: #252535;
  --accent: #f5c400;
  --accent-dim: #9a7c00;
  --text: #e0e0e0;
  --text-dim: #666;
  --bugs: #4caf50;
  --bots: #ef5350;
  --squids: #8b7cf6;
  --bugs-bg: #0f2312;
  --bots-bg: #200f0f;
  --squids-bg: #150f2a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  min-height: 100vh;
  padding: 20px 24px;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
h1 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.search-wrap {
  position: relative;
  flex: 0 0 200px;
}
.search-wrap input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 10px 5px 28px;
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
}
.search-wrap input:focus { outline: none; border-color: var(--accent-dim); }
.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 12px;
  pointer-events: none;
}
.divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
.filter-btn {
  padding: 4px 13px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent-dim); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.filter-btn.bugs.active { background: var(--bugs); border-color: var(--bugs); color: #000; }
.filter-btn.bots.active { background: var(--bots); border-color: var(--bots); color: #000; }
.filter-btn.squids.active { background: var(--squids); border-color: var(--squids); color: #000; }
.spacer { flex: 1; }
.btn-add {
  padding: 5px 15px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: inherit;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.btn-add:hover { background: #ffd000; }
/* ── File banner ─────────────────────────────────────────────── */
#fileBanner { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 10px; border-radius: 4px; font-size: 11px; }
#fileBanner.fb-unlinked { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); }
#fileBanner.fb-resume   { background: var(--surface); border: 1px solid var(--accent-dim); }
#fileBanner.fb-active   { background: var(--surface); border: 1px solid #1f3a1f; color: var(--text-dim); }
.fb-btn { background: none; border: 1px solid var(--border); color: var(--accent); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-family: inherit; }
.fb-btn:hover { background: var(--accent); color: #000; }
.fb-btn-dim { color: var(--text-dim); }
.fb-btn-dim:hover { background: var(--surface2); color: var(--text); }

.btn-export {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  white-space: nowrap;
}
.btn-export:hover { border-color: var(--accent-dim); color: var(--text); }
.count { font-size: 11px; color: var(--text-dim); }
table { width: 100%; border-collapse: collapse; }
colgroup col:nth-child(1) { width: 15%; }
colgroup col:nth-child(2) { width: 9%; }
colgroup col:nth-child(3) { width: 10%; }
colgroup col:nth-child(4) { width: 30%; }
colgroup col:nth-child(5) { width: 31%; }
colgroup col:nth-child(6) { width: 5%; }
th {
  text-align: left;
  padding: 7px 12px;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
  user-select: none;
}
th.sortable { cursor: pointer; }
th.sortable:hover { color: #fff; }
th.sort-asc::after { content: ' ↑'; }
th.sort-desc::after { content: ' ↓'; }
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  white-space: pre-wrap;
  line-height: 1.55;
}
tr:hover td { background: var(--surface2); }
.col-name { font-weight: 600; color: #fff; }
.col-date { white-space: nowrap; color: var(--text-dim); font-size: 12px; }
.col-factions { white-space: normal; }
.badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  margin: 1px 2px 1px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.badge-bugs { background: var(--bugs-bg); color: var(--bugs); }
.badge-bots { background: var(--bots-bg); color: var(--bots); }
.badge-squids { background: var(--squids-bg); color: var(--squids); }
.badge-gen { color: var(--text-dim); font-size: 10px; font-weight: normal; font-style: italic; }
.col-edit { text-align: center; }
.btn-edit {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 3px;
  font-size: 13px;
  line-height: 1;
}
.btn-edit:hover { color: var(--accent); background: var(--surface2); }
.empty { text-align: center; color: var(--text-dim); padding: 40px; font-style: italic; }
.notes-block {
  margin-top: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-dim);
  border-radius: 6px;
  padding: 14px 16px;
}
.notes-block-title {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  font-weight: 700;
}
.notes-block p { color: var(--text-dim); line-height: 1.7; }

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  width: 480px;
  max-width: 96vw;
  max-height: 92vh;
  overflow-y: auto;
}
.modal-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.modal-date {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 14px;
}
.field { margin-bottom: 15px; }
.field label {
  display: block;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 5px;
}
.field input, .field textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  resize: vertical;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent-dim); }
.field input.error { border-color: var(--bots); }
.faction-checks { display: flex; gap: 18px; }
.faction-check {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text);
}
.faction-check input[type=checkbox] {
  width: auto;
  accent-color: var(--accent);
  cursor: pointer;
}
.modal-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-save {
  padding: 7px 20px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: inherit;
}
.btn-save:hover { background: #ffd000; }
.btn-cancel {
  padding: 7px 16px;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-cancel:hover { color: var(--text); }
.btn-delete {
  margin-right: auto;
  padding: 7px 14px;
  background: transparent;
  color: var(--bots);
  border: 1px solid var(--bots);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-delete:hover { background: var(--bots-bg); }

/* ── Faction board panel ────────────────────────────────────────── */
#factionPanel { margin-bottom: 12px; }
.fp-wrap { padding: 10px 14px; border-radius: 6px; border-left: 3px solid; display: flex; flex-direction: column; gap: 7px; }
.fp-wrap.fp-bugs   { border-color: var(--bugs);   background: rgba(76,175,80,.04); }
.fp-wrap.fp-bots   { border-color: var(--bots);   background: rgba(239,83,80,.04); }
.fp-wrap.fp-squids { border-color: var(--squids); background: rgba(139,124,246,.04); }
.fp-row { display: flex; align-items: flex-start; flex-wrap: nowrap; gap: 5px; min-height: 24px; }
.fp-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
  color: var(--text-dim); min-width: 90px; cursor: pointer; line-height: 1; user-select: none;
  padding-top: 3px; flex-shrink: 0; }
.fp-label:hover { color: var(--text); }
.fp-chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; align-items: center; }
.fp-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 8px;
  border-radius: 12px; font-size: 11px; background: var(--surface2); border: 1px solid var(--border); line-height: 1.4; }
.fp-chip-bugs   { border-color: rgba(76,175,80,.45);  color: var(--bugs); }
.fp-chip-bots   { border-color: rgba(239,83,80,.45);  color: var(--bots); }
.fp-chip-squids { border-color: rgba(139,124,246,.45); color: var(--squids); }
.fp-chip-strat-r { border-color: rgba(239,83,80,.45);  color: #ef5350; }
.fp-chip-strat-b { border-color: rgba(74,158,255,.45); color: #4a9eff; }
.fp-chip-strat-g { border-color: rgba(76,175,80,.45);  color: #4caf50; }
.fp-chip[draggable] { cursor: grab; }
.fp-chip[draggable]:active { cursor: grabbing; }
.fp-chip.dragging { opacity: 0.35; }
.fp-chip.drag-left  { box-shadow: -3px 0 0 var(--accent); }
.fp-chip.drag-right { box-shadow:  3px 0 0 var(--accent); }
.fp-chip-remove { background: none; border: none; cursor: pointer; font-size: 12px;
  color: inherit; opacity: 0.45; padding: 0; line-height: 1; }
.fp-chip-remove:hover { opacity: 1; }
.fp-add-item { background: none; border: 1px dashed var(--border); color: var(--text-dim);
  padding: 1px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; font-family: inherit; line-height: 1.4; }
.fp-add-item:hover { border-color: var(--accent); color: var(--accent); }
.fp-input { background: var(--surface2); border: 1px solid var(--accent); color: var(--text);
  padding: 2px 8px; border-radius: 12px; font-size: 11px; font-family: inherit; outline: none; width: 180px; }
.fp-search-row { position: relative; padding: 2px 0 2px 96px; }
.fp-dropdown { position: absolute; top: calc(100% + 2px); left: 96px; min-width: 220px; max-width: 320px;
  background: var(--surface); border: 1px solid var(--accent); border-radius: 4px;
  z-index: 100; max-height: 220px; overflow-y: auto; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.fp-option { display: block; width: 100%; padding: 5px 11px; background: none; border: none;
  color: var(--text); text-align: left; cursor: pointer; font-size: 12px; font-family: inherit; }
.fp-option:hover, .fp-option:focus { background: var(--surface2); color: var(--accent); outline: none; }
.fp-option-empty { padding: 6px 11px; font-size: 12px; color: var(--text-dim); }

/* ── Organization controls ───────────────────────────────────────── */
.controls-2 { margin-top: -8px; }
.ctl-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.ctl-select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 4px 6px; border-radius: 4px; font-size: 12px; font-family: inherit;
}
.ctl-select:focus { outline: none; border-color: var(--accent-dim); }
.ctl-check { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
.ctl-check input { accent-color: var(--accent); cursor: pointer; }
.filter-btn.general.active { background: var(--text-dim); border-color: var(--text-dim); color: #000; }
.tag-filter { padding: 3px 10px; border-radius: 12px; }
.tag-filter.active { background: var(--surface2); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.view-toggle { display: inline-flex; }
.view-toggle .filter-btn { border-radius: 0; }
.view-toggle .filter-btn:first-child { border-radius: 4px 0 0 4px; }
.view-toggle .filter-btn:last-child  { border-radius: 0 4px 4px 0; border-left: none; }

/* ── Groups ──────────────────────────────────────────────────────── */
.group-head {
  display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent);
  padding: 10px 4px 6px; border-bottom: 1px solid var(--border);
}
.group-head:hover { color: #fff; }
.group-head .caret { display: inline-block; width: 10px; transition: transform .12s; }
.group-head.collapsed .caret { transform: rotate(-90deg); }
.group-head .group-count { color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
tr.group-row td { padding: 0; background: var(--bg) !important; border-bottom: none; }
.group-bugs   { color: var(--bugs); }
.group-bots   { color: var(--bots); }
.group-squids { color: var(--squids); }

/* ── Row / card content ──────────────────────────────────────────── */
.col-fav { text-align: center; width: 28px; }
.btn-fav { background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1; color: var(--border); padding: 2px; }
.btn-fav:hover { color: var(--accent-dim); }
.btn-fav.on { color: var(--accent); }
.name-tags { margin-left: 4px; }
.role-label { display: block; font-size: 10px; font-weight: 400; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; margin-top: 2px; }
.tag-badge { display: inline-block; font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 10px; padding: 0 6px; margin: 2px 3px 0 0; white-space: nowrap; }
.col-actions { white-space: nowrap; text-align: right; }
.btn-act {
  background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 3px 5px;
  border-radius: 3px; font-size: 12px; line-height: 1; font-family: inherit;
}
.btn-act:hover { color: var(--accent); background: var(--surface2); }
.used-count { font-size: 10px; color: var(--text-dim); margin-left: 1px; }

.slots { display: flex; flex-direction: column; gap: 3px; white-space: normal; }
.slot-line { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.slot-key { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); width: 44px; flex-shrink: 0; }
.chip {
  display: inline-block; padding: 1px 8px; border-radius: 11px; font-size: 11px; line-height: 1.5;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text); cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--accent-dim); }
.chip-strat-r { border-color: rgba(239,83,80,.45);  color: #ef5350; }
.chip-strat-b { border-color: rgba(74,158,255,.45); color: #4a9eff; }
.chip-strat-g { border-color: rgba(76,175,80,.45);  color: #4caf50; }
.chip-flex { border-style: dashed; color: var(--text-dim); cursor: default; }
.chip-warn { box-shadow: 0 0 0 1px var(--bots); }
.chip-dim { color: var(--text-dim); }
.slot-extra { color: var(--text-dim); white-space: pre-wrap; font-size: 12px; margin-top: 2px; }
.warn-line { color: var(--bots); font-size: 11px; }

/* ── Breakpoints ─────────────────────────────────────────────────── */
details.bp { margin-top: 6px; white-space: normal; }
details.bp summary { cursor: pointer; font-size: 11px; color: var(--accent-dim); user-select: none; }
details.bp summary:hover { color: var(--accent); }
.bp-links { display: inline; margin-left: 8px; }
.bp-links a { color: var(--text-dim); font-size: 11px; text-decoration: none; }
.bp-links a:hover { color: var(--accent); }
.bp-scroll { overflow-x: auto; max-width: 100%; }
.bp-table { border-collapse: collapse; width: auto; margin-top: 5px; font-size: 11px; }
.bp-table th, .bp-table td { padding: 2px 6px; border: none; border-bottom: 1px solid var(--border); white-space: nowrap; line-height: 1.4; background: none !important; }
.bp-table th { font-size: 9px; letter-spacing: .5px; color: var(--text-dim); text-transform: none; font-weight: 600; background: none; }
.bp-table th.bp-fac { text-align: left; padding-top: 6px; }
.bp-table td.bp-w { color: var(--text); }
.bp-table td.bp-n { text-align: center; font-weight: 700; cursor: help; }
.bp-1 { color: #66bb6a; } .bp-2 { color: #9ccc65; } .bp-3 { color: #d4e157; }
.bp-4 { color: #ffca28; } .bp-6 { color: #ffa726; } .bp-hi { color: #ef6c00; } .bp-no { color: #444; }
.bp-note { font-size: 10px; color: var(--text-dim); margin-top: 3px; font-style: italic; }

/* ── Card view ───────────────────────────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; padding: 10px 0 6px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; min-width: 0;
}
.card:hover { border-color: #33334a; }
.card-head { display: flex; align-items: flex-start; gap: 6px; }
.card-title { flex: 1; font-weight: 600; color: #fff; font-size: 14px; min-width: 0; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; color: var(--text-dim); }
.card-notes { white-space: pre-wrap; color: #bbb; font-size: 12px; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 6px; }
.card-foot { display: flex; justify-content: flex-end; gap: 2px; margin-top: auto; }

/* ── Modal additions ─────────────────────────────────────────────── */
.modal { width: 640px; }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; min-width: 0; }
.slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.slot-grid .field { margin-bottom: 0; }
.slot-grid .span2 { grid-column: span 2; }
.tag-picks { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tag-pick { padding: 2px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); cursor: pointer; font-size: 12px; font-family: inherit; }
.tag-pick.on { border-color: var(--accent); color: var(--accent); }
.tag-picks input { width: 150px !important; padding: 3px 8px !important; border-radius: 12px !important; }
.orig-build { margin-top: 6px; font-size: 11px; color: var(--text-dim); }
.orig-build pre { white-space: pre-wrap; font-family: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin-top: 4px; }
.orig-build button { margin-top: 4px; }
.modal-hint { font-size: 10px; color: var(--text-dim); margin-right: auto; }
.btn-delete + .modal-hint { margin-right: 0; margin-left: 8px; }
.section-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin: 4px 0 8px; font-weight: 700; }

@media (max-width: 700px) {
  body { padding: 14px 16px; }
  .search-wrap { flex: 1 1 100%; }
  .slot-grid { grid-template-columns: 1fr; }
  .slot-grid .span2 { grid-column: auto; }
  .field-row { flex-direction: column; gap: 0; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="fileBanner"></div>

<header>
  <h1>⚡ HD2 Loadouts</h1>
  <div class="spacer"></div>
  <button class="btn-export" onclick="exportJSON()" title="Download all loadouts + faction boards as JSON">⬇ Export JSON</button>
  <button class="btn-export" onclick="document.getElementById('importFile').click()" title="Replace loadouts + faction boards from a JSON export">⬆ Import JSON</button>
  <button class="btn-export" onclick="exportHTML()" title="Download this page with your loadouts baked in as the default data">⬇ Export HTML</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">&#9906;</span>
    <input type="text" id="searchInput" placeholder="Search name, item, tag, notes…" oninput="render()">
  </div>
  <div class="divider"></div>
  <button class="filter-btn active" data-faction="all" onclick="setFaction(this)">All</button>
  <button class="filter-btn bugs"   data-faction="bugs"   onclick="setFaction(this)">🦟 Bugs</button>
  <button class="filter-btn bots"   data-faction="bots"   onclick="setFaction(this)">🤖 Bots</button>
  <button class="filter-btn squids" data-faction="squids" onclick="setFaction(this)">🦑 Squids</button>
  <button class="filter-btn general" data-faction="general" onclick="setFaction(this)" title="Only loadouts with no faction set">General</button>
  <div class="divider"></div>
  <span class="count" id="countLabel"></span>
  <div class="spacer"></div>
  <button class="btn-add" onclick="openModal()">+ Add Loadout</button>
</div>

<div class="controls controls-2">
  <span class="ctl-label">Tags</span>
  <span id="tagFilters" style="display:contents"></span>
  <div class="divider"></div>
  <span class="ctl-label">Group</span>
  <select class="ctl-select" id="groupSel" onchange="setPref('groupBy', this.value)">
    <option value="none">None</option>
    <option value="faction">Faction</option>
    <option value="role">Role</option>
    <option value="tag">Tag</option>
  </select>
  <span class="ctl-label">Sort</span>
  <select class="ctl-select" id="sortSel" onchange="setPref('sortKey', this.value)">
    <option value="dateAdded">Recently added</option>
    <option value="updatedAt">Recently edited</option>
    <option value="lastUsed">Recently used</option>
    <option value="uses">Most used</option>
    <option value="name">Name A–Z</option>
  </select>
  <label class="ctl-check"><input type="checkbox" id="favFirst" onchange="setPref('favFirst', this.checked)"> ★ first</label>
  <div class="spacer"></div>
  <div class="view-toggle">
    <button class="filter-btn" id="view-table" onclick="setPref('view', 'table')">☰ Table</button>
    <button class="filter-btn" id="view-cards" onclick="setPref('view', 'cards')">▦ Cards</button>
  </div>
</div>

<div id="factionPanel"></div>

<div id="list"></div>

<div class="notes-block">
  <div class="notes-block-title">General Notes</div>
  <p>Throwing: ~45–50m at 45°, ~75–80m with dive<br>
  Command Bunker: target lower 3 heat sinks → hatch opens → toss any throwable. Top slots optional; the slot-shaped thing is <em>not</em> part of the body.</p>
</div>

<!-- Item suggestions for the slot inputs (filled at startup) -->
<datalist id="dl-armor"></datalist>
<datalist id="dl-primary"></datalist>
<datalist id="dl-secondary"></datalist>
<datalist id="dl-grenade"></datalist>
<datalist id="dl-strat"></datalist>
<datalist id="dl-booster"></datalist>
<datalist id="dl-role"></datalist>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Loadout</div>
    <div class="modal-date" id="modalDateAdded"></div>
    <div class="field-row">
      <div class="field" style="flex:2">
        <label>Name</label>
        <input type="text" id="fName" placeholder="e.g. Anti-tank">
      </div>
      <div class="field">
        <label>Role</label>
        <input type="text" id="fRole" list="dl-role" placeholder="e.g. Anti-tank">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Factions <span style="text-transform:none;letter-spacing:0">(none = general)</span></label>
        <div class="faction-checks">
          <label class="faction-check"><input type="checkbox" id="fBugs"> 🦟 Bugs</label>
          <label class="faction-check"><input type="checkbox" id="fBots"> 🤖 Bots</label>
          <label class="faction-check"><input type="checkbox" id="fSquids"> 🦑 Squids</label>
        </div>
      </div>
      <div class="field" style="flex:0 0 auto">
        <label>&nbsp;</label>
        <label class="faction-check"><input type="checkbox" id="fFav"> ★ Favorite</label>
      </div>
    </div>
    <div class="field">
      <label>Tags</label>
      <div class="tag-picks" id="fTags"></div>
    </div>

    <div class="section-label">Build</div>
    <div class="slot-grid">
      <div class="field"><label>Armor</label><input type="text" id="fArmor" list="dl-armor" placeholder="e.g. Siege-Ready medium"></div>
      <div class="field"><label>Booster</label><input type="text" id="fBooster" list="dl-booster"></div>
      <div class="field"><label>Primary</label><input type="text" id="fPrimary" list="dl-primary"></div>
      <div class="field"><label>Secondary</label><input type="text" id="fSecondary" list="dl-secondary"></div>
      <div class="field"><label>Grenade</label><input type="text" id="fGrenade" list="dl-grenade"></div>
      <div class="field"></div>
      <div class="field"><label>Stratagem 1</label><input type="text" id="fStrat0" list="dl-strat" oninput="checkStratDupes()"></div>
      <div class="field"><label>Stratagem 2</label><input type="text" id="fStrat1" list="dl-strat" oninput="checkStratDupes()"></div>
      <div class="field"><label>Stratagem 3</label><input type="text" id="fStrat2" list="dl-strat" oninput="checkStratDupes()"></div>
      <div class="field"><label>Stratagem 4</label><input type="text" id="fStrat3" list="dl-strat" oninput="checkStratDupes()"></div>
      <div class="span2 warn-line" id="stratWarn"></div>
      <div class="field span2">
        <label>Other build notes</label>
        <textarea id="fExtra" rows="2" placeholder="alternatives, flex picks… (use “A / B” in a slot for either-or)"></textarea>
        <div class="orig-build" id="origBuild"></div>
      </div>
    </div>

    <div class="field" style="margin-top:12px">
      <label>Notes</label>
      <textarea id="fNotes" rows="5" placeholder="tips, breakpoints, synergies…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="btnDelete" onclick="deleteRow()" style="display:none">Delete</button>
      <span class="modal-hint">Ctrl+Enter to save</span>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveRow()">Save</button>
    </div>
  </div>
</div>

// ── Loadout data model ─────────────────────────────────────────────────────
// Row shape (schema 2):
//   { id, name, role, factions[], tags[], favorite,
//     slots: { armor, booster, primary, secondary, grenade, stratagems[4] },
//     extra,            // free-text build notes that don't fit a slot
//     notes,
//     dateAdded, dateEstimated?, updatedAt, lastUsed, uses,
//     buildOriginal?,   // pre-migration free-text build, kept until discarded
//     schema }
// A slot may hold "A / B" for either-or picks; "Flex" marks an open stratagem.
const SCHEMA = 2;

const TAG_DEFS = [
  { id: 'experimental', icon: '🧪', label: 'Experimental' },
  { id: 'fun',          icon: '🎉', label: 'Fun' },
  { id: 'stealth',      icon: '🥷', label: 'Stealth' },
  { id: 'arc',          icon: '⚡', label: 'Arc' },
  { id: 'fire',         icon: '🔥', label: 'Fire' },
  { id: 'gas',          icon: '☣️', label: 'Gas' },
  { id: 'solo',         icon: '🐺', label: 'Solo' },
];
const TAG_BY_ID = Object.fromEntries(TAG_DEFS.map(t => [t.id, t]));
// Leading name emoji → tag (💎 marked go-to builds, which is now the ★ favorite)
const EMOJI_TAGS = { '🧪': 'experimental', '🥷': 'stealth', '👻': 'stealth', '⚡': 'arc', '🔥': 'fire', '☣': 'gas', '🎉': 'fun', '🐺': 'solo' };
const ROLE_PRESETS = ['Anti-tank', 'Crowd control', 'Generalist', 'Support', 'Stealth', 'Fun'];

const ARMOR_SUGGESTIONS = [
  'Light', 'Medium', 'Heavy',
  'Democracy Protects', 'Engineering Kit', 'Extra Padding', 'Fortified', 'Med-Kit', 'Servo-Assisted',
  'Scout', 'Peak Physique', 'Siege-Ready', 'Unflinching', 'Acclimated', 'Inflammable',
  'Advanced Filtration', 'Integrated Explosives', 'Electrical Conduit', 'Ballistic Padding',
  'Reinforced Epaulettes', 'Adreno-Defibrillator', 'Feet First', 'Rock Solid', 'Gunslinger',
];
const BOOSTERS = [
  'Hellpod Space Optimization', 'Vitality Enhancement', 'UAV Recon Booster', 'Stamina Enhancement',
  'Muscle Enhancement', 'Increased Reinforcement Budget', 'Flexible Reinforcement Budget',
  'Localization Confusion', 'Expert Extraction Pilot', 'Motivational Shocks', 'Experimental Infusion',
  'Firebomb Hellpods', 'Dead Sprint', 'Armed Resupply Pods', 'Sample Extricator', 'Sample Scanner',
  'Stun Pods', 'Integrated Extinguishers',
];

const WEAPON_BY_NAME = new Map(CALC_WEAPONS.map(w => [w.name.toLowerCase(), w]));
const PRIMARIES   = CALC_WEAPONS.filter(w => w.category === 'Primary').map(w => w.name).sort();
const SECONDARIES = CALC_WEAPONS.filter(w => w.category === 'Secondary').map(w => w.name).sort();

const emptySlots = () => ({ armor: '', booster: '', primary: '', secondary: '', grenade: '', stratagems: ['', '', '', ''] });
const splitAlts  = v => (v || '').split(/\s+\/\s+/).map(s => s.trim()).filter(Boolean);

// ── Free-text build → slots (one-time migration, best effort) ─────────────
// Shorthand seen in builds that doesn't word-match an item name
const ALIASES = {
  'amr': 'APW-1 Anti-Materiel Rifle', 'hmg': 'MG-206 Heavy Machine Gun', 'mmg': 'MG-43 Machine Gun',
  'mg': 'MG-43 Machine Gun', 'auto-c': 'AC-8 Autocannon', 'autocannon': 'AC-8 Autocannon',
  'eat': 'EAT-17 Expendable Anti-Tank', 'leveler': 'EAT-411 Leveller', 'xbow': 'CB-9 Exploding Crossbow',
  'pissile': 'P-33 Missile Pistol', 'at emplacement': 'E/AT-12 Anti-Tank Emplacement',
  'grenade battlement': 'E/GL-21 Grenadier Battlement',
  '500': 'Eagle 500kg Bomb', '500kg': 'Eagle 500kg Bomb', '500 kg': 'Eagle 500kg Bomb', 'rr': 'GR-8 Recoilless Rifle',
};
const PARSE_LISTS = () => [
  ['primary',   PRIMARIES],
  ['secondary', SECONDARIES],
  ['grenade',   GRENADES_LIST],
  ['strat',     STRATAGEMS_LIST],
  ['booster',   BOOSTERS],
];
const words = s => s.toLowerCase().split(/[\s\/\-]+/).filter(Boolean);

function matchItem(token) {
  const t = token.toLowerCase().replace(/\b(grenades?|booster)\s*$/, '').trim();
  if (!t) return null;
  const all = PARSE_LISTS().flatMap(([kind, list]) => list.map(name => ({ kind, name })));
  if (ALIASES[t]) return all.find(c => c.name === ALIASES[t]) || null;
  // 1. exact short-name match ("gas" → G-4 Gas, not Orbital Gas Strike)
  const exact = all.filter(c => shortName(c.name).toLowerCase() === t);
  if (exact.length === 1) return exact[0];
  // 2. every token word is a prefix of some word in the name ("grenade battlement" → Grenadier Battlement)
  const tw = words(t);
  const hits = all.filter(c => { const nw = words(c.name); return tw.every(w => nw.some(n => n.startsWith(w))); });
  if (hits.length <= 1) return hits[0] || null;
  // Tie-break: the single shortest name wins ("airstrike" → Eagle Airstrike over Eagle Gas Airstrike)
  const len = c => words(shortName(c.name)).length;
  const min = Math.min(...hits.map(len));
  const best = hits.filter(c => len(c) === min);
  return best.length === 1 ? best[0] : null;
}

function parseBuild(text) {
  const slots = emptySlots();
  const extra = [];
  let strats = [];
  const lines = (text || '').split('\n');
  let firstToken = true;
  for (const line of lines) {
    if (!line.trim()) continue;
    // split on commas outside parentheses
    const tokens = line.split(/,(?![^(]*\))/).map(s => s.trim()).filter(Boolean);
    const leftover = [];
    for (const tok of tokens) {
      const isFirst = firstToken; firstToken = false;
      const flex = tok.match(/^(\d+)?\s*flex$/i);
      if (flex) { for (let i = 0; i < (+flex[1] || 1); i++) strats.push('Flex'); continue; }
      // either-or: "quasar/recoilless", "eagle 500 / orbital gas"
      const parts = tok.split('/').map(s => s.trim()).filter(Boolean);
      let matches = parts.length > 1 ? parts.map(matchItem) : [matchItem(tok)];
      if (parts.length > 1 && matches.some(m => !m)) { const whole = matchItem(tok); matches = whole ? [whole] : [null]; }
      const kinds = new Set(matches.map(m => m && m.kind));
      if (matches.every(Boolean) && kinds.size === 1) {
        const kind = matches[0].kind, value = matches.map(m => m.name).join(' / ');
        if (kind === 'strat') { if (!strats.includes(value)) { strats.push(value); continue; } }
        else if (!slots[kind]) { slots[kind] = value; continue; }
      } else if (!slots.armor && (isFirst || /\b(armor|light|med|medium|heavy)\b/i.test(tok))) {
        slots.armor = tok; continue;
      }
      leftover.push(tok);
    }
    if (leftover.length) extra.push(leftover.join(', '));
  }
  if (strats.length > 4) { extra.push(strats.slice(4).join(', ')); strats = strats.slice(0, 4); }
  slots.stratagems = [...strats, '', '', '', ''].slice(0, 4);
  return { slots, extra: extra.join('\n') };
}

function guessRole(name) {
  if (/anti-?\s?tank|\bAT\b/i.test(name)) return 'Anti-tank';
  if (/crowd/i.test(name)) return 'Crowd control';
  if (/ghost|stealth/i.test(name)) return 'Stealth';
  return '';
}

function migrateRow(r) {
  if (r.schema >= SCHEMA) return r;
  const out = { ...r, factions: r.factions || [], tags: [...(r.tags || [])], favorite: !!r.favorite };
  // Pull known emoji prefixes off the name into tags / favorite
  let name = r.name || '';
  for (;;) {
    const m = name.match(/^\s*(\p{Extended_Pictographic})️?/u);
    if (!m) break;
    if (m[1] === '💎') out.favorite = true;
    else if (EMOJI_TAGS[m[1]]) { if (!out.tags.includes(EMOJI_TAGS[m[1]])) out.tags.push(EMOJI_TAGS[m[1]]); }
    else break;
    name = name.slice(m[0].length);
  }
  out.name = name.trim() || r.name || 'Untitled';
  if (out.role == null) out.role = guessRole(out.name);
  if (!out.slots) {
    const parsed = parseBuild(r.build);
    out.slots = parsed.slots;
    out.extra = parsed.extra;
    if (r.build && r.build.trim()) out.buildOriginal = r.build;
  }
  delete out.build;
  out.notes = out.notes || '';
  out.uses = out.uses || 0;
  out.schema = SCHEMA;
  return out;
}

// Rows from before dateAdded existed: give them estimated dates just before the
// oldest real one, keeping their id order, so date sorts stay meaningful.
function backfillDates(list) {
  const undated = list.filter(r => !r.dateAdded).sort((a, b) => a.id - b.id);
  if (!undated.length) return;
  const known = list.filter(r => r.dateAdded).map(r => Date.parse(r.dateAdded));
  const base = (known.length ? Math.min(...known) : Date.now()) - 86400000;
  undated.forEach((r, i) => {
    r.dateAdded = new Date(base - (undated.length - i) * 60000).toISOString();
    r.dateEstimated = true;
  });
}

function migrateAll(list) {
  const out = (list || []).map(migrateRow);
  backfillDates(out);
  return out;
}

// ── Breakpoints (uses hd-calc.js engine + CALC_* data) ────────────────────
const ENEMY_BY_ID = new Map(CALC_ENEMIES.map(e => [e.id, e]));

function findWeapon(name) {
  const n = name.toLowerCase();
  return WEAPON_BY_NAME.get(n) || CALC_WEAPONS.find(w => shortName(w.name).toLowerCase() === n) || null;
}

// Every weapon in a loadout that the damage engine knows about
function loadoutWeapons(r) {
  const s = r.slots || emptySlots();
  const names = [s.primary, s.secondary, s.grenade, ...s.stratagems].flatMap(splitAlts);
  const seen = new Set();
  return names.map(findWeapon).filter(w => w && !seen.has(w.id) && seen.add(w.id));
}

// Fewest hits to kill via any fatal part (or Main), best mode, uncharged.
function bestKill(weapon, enemy) {
  const main = enemy.parts.find(p => p.name === 'Main') || enemy.parts[0];
  let best = { n: Infinity };
  for (const part of enemy.parts) {
    if (!part.fatal && part !== main) continue;
    const hp = partHP(part, main.health);
    if (hp <= 0) continue;   // e.g. untargetable "Inner" parts listed with no health
    weapon.modes.forEach((m, i) => {
      const n = stk(calcHit(weapon, i, part).total, hp);
      if (n < best.n) best = { n, part: part.name, mode: m.name };
    });
  }
  return best;
}

function bpClass(n) {
  if (!isFinite(n)) return 'bp-no';
  if (n <= 3) return 'bp-' + n;
  if (n <= 5) return 'bp-4';
  if (n <= 8) return 'bp-6';
  return 'bp-hi';
}

function bpFactions(r) {
  if (r.factions.length) return r.factions;
  return FACTION_HEAVIES[faction] ? [faction] : ['bugs', 'bots', 'squids'];
}

function calcLink(r, weapons) {
  const f = bpFactions(r)[0];
  return `damage-calc.html#w=${weapons.map(w => w.id).join(',')}&faction=${f}`;
}

function breakpointsHTML(r) {
  const weapons = loadoutWeapons(r);
  if (!weapons.length) return '';
  const facs = bpFactions(r);
  let body = '';
  for (const f of facs) {
    const enemies = (FACTION_HEAVIES[f] || []).map(id => ENEMY_BY_ID.get(id)).filter(Boolean);
    body += `<tr><th class="bp-fac group-${f}">${f}</th>${enemies.map(e =>
      `<th title="${x(e.name)}">${x(e.name.replace(/ (Tank|Strider|Ship)$/, ''))}</th>`).join('')}</tr>`;
    for (const w of weapons) {
      body += `<tr><td class="bp-w">${x(shortName(w.name))}</td>${enemies.map(e => {
        const b = bestKill(w, e);
        const txt = isFinite(b.n) ? (b.n > 99 ? '99+' : b.n) : '✕';
        const tip = isFinite(b.n) ? `${b.n} hit${b.n === 1 ? '' : 's'} · ${b.part}${b.mode !== 'Default' ? ' · ' + b.mode : ''}` : "can't penetrate a fatal part";
        return `<td class="bp-n ${bpClass(b.n)}" title="${x(tip)}">${txt}</td>`;
      }).join('')}</tr>`;
    }
  }
  return `<details class="bp" data-id="${r.id}"${openBreakpoints.has(r.id) ? ' open' : ''}>
    <summary>Breakpoints vs heavies</summary>
    <div class="bp-scroll"><table class="bp-table">${body}</table></div>
    <div class="bp-note">Hits to kill via the weakest fatal part, best mode, every hit landing. Fire/gas ticks and charge-up not modeled.</div>
  </details>`;
}

// ── Storage ────────────────────────────────────────────────────────────────
const LS_KEY = 'hd2_v1';

function loadData() {
  const raw = localStorage.getItem(LS_KEY);
  const stored = raw ? JSON.parse(raw) : structuredClone(SEED);
  const migrated = migrateAll(stored);
  if (!raw || JSON.stringify(migrated) !== raw) localStorage.setItem(LS_KEY, JSON.stringify(migrated));
  return migrated;
}

function persist(data) {
  localStorage.setItem(LS_KEY, JSON.stringify(data));  // always keep as fallback
  fsWrite(data);                                        // also write to file if linked
}

// ── File System API ────────────────────────────────────────────────────────
let fsHandle  = null;   // FileSystemFileHandle
let fsReady   = false;  // permission currently granted

// Minimal IndexedDB wrapper — only used to persist the FileSystemFileHandle
function _idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('hd2_fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { try { res(fn(r.result.transaction('kv', mode).objectStore('kv'))); } catch(e) { rej(e); } };
    r.onerror   = () => rej(r.error);
  });
}
const idbGet = k    => _idb('readonly',  s => new Promise(r => { const q = s.get(k); q.onsuccess = () => r(q.result ?? null); q.onerror = () => r(null); }));
const idbSet = (k,v)=> _idb('readwrite', s => new Promise(r => { s.put(v,k); s.transaction.oncomplete = r; }));

async function fsWrite(rowsData) {
  if (!fsHandle || !fsReady) return;
  try {
    const w = await fsHandle.createWritable();
    await w.write(JSON.stringify({ schema: SCHEMA, rows: rowsData, boards }, null, 2));
    await w.close();
  } catch { fsReady = false; updateBanner(); }
}

async function _activateHandle(handle) {
  fsHandle = handle;
  fsReady  = true;
  await idbSet('fh', handle);
  // Read file — if it has data, load it; if empty/new, seed it with current rows
  let fileData = null;
  try {
    const txt = await (await handle.getFile()).text();
    if (txt.trim()) fileData = JSON.parse(txt);
  } catch {}
  if (fileData !== null) {
    const fileRows   = Array.isArray(fileData) ? fileData : fileData.rows;
    const fileBoards = !Array.isArray(fileData) ? fileData.boards : null;
    if (Array.isArray(fileRows))  { rows   = migrateAll(fileRows); render(); }
    if (fileBoards)               { boards = fileBoards; renderPanel(); }
  } else { await fsWrite(rows); }
  updateBanner();
}

async function fsNew() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'loadouts.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
    await _activateHandle(h);
  } catch {}
}

async function fsOpen() {
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
    await _activateHandle(h);
  } catch {}
}

async function fsResume() {
  if (!fsHandle) return;
  try {
    if (await fsHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
    fsReady = true;
    const txt = await (await fsHandle.getFile()).text();
    if (txt.trim()) {
      const d = JSON.parse(txt);
      const fileRows   = Array.isArray(d) ? d : d.rows;
      const fileBoards = !Array.isArray(d) ? d.boards : null;
      if (Array.isArray(fileRows))  { rows   = migrateAll(fileRows); render(); }
      if (fileBoards)               { boards = fileBoards; renderPanel(); }
    }
    updateBanner();
  } catch {}
}

function updateBanner() {
  const el = document.getElementById('fileBanner');
  if (!fsHandle) {
    el.className = 'fb-unlinked';
    el.innerHTML = `No save file linked &nbsp;<button class="fb-btn" onclick="fsNew()">New</button> <button class="fb-btn" onclick="fsOpen()">Open existing</button>`;
  } else if (!fsReady) {
    el.className = 'fb-resume';
    el.innerHTML = `📂 <b>${fsHandle.name}</b> &nbsp;<button class="fb-btn" onclick="fsResume()">Load</button>`;
  } else {
    el.className = 'fb-active';
    el.innerHTML = `💾 <b>${fsHandle.name}</b> &nbsp;<button class="fb-btn fb-btn-dim" onclick="fsOpen()">Change</button>`;
  }
}

async function initFS() {
  if (!('showOpenFilePicker' in window)) return; // file:// or unsupported browser — localStorage only
  try {
    const handle = await idbGet('fh');
    if (!handle) { updateBanner(); return; }
    fsHandle = handle;
    if (await handle.queryPermission({ mode: 'readwrite' }) === 'granted') {
      await fsResume();
    } else {
      updateBanner();
    }
  } catch { updateBanner(); }
}

// ── State ──────────────────────────────────────────────────────────────────
let rows = loadData();
let faction = 'all';
let editId = null;
let editTags = [];
const tagFilter = new Set();
const openBreakpoints = new Set();   // row ids whose breakpoint table is expanded

const PREFS_KEY = LS_KEY + '_prefs';
const prefs = Object.assign(
  { view: 'table', groupBy: 'none', sortKey: 'dateAdded', favFirst: true, collapsed: [] },
  (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch { return {}; } })()
);
function setPref(key, val) {
  prefs[key] = val;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
  syncControls();
  render();
}
function syncControls() {
  document.getElementById('groupSel').value = prefs.groupBy;
  document.getElementById('sortSel').value  = prefs.sortKey;
  document.getElementById('favFirst').checked = prefs.favFirst;
  document.getElementById('view-table').classList.toggle('active', prefs.view === 'table');
  document.getElementById('view-cards').classList.toggle('active', prefs.view === 'cards');

// ── Helpers ────────────────────────────────────────────────────────────────
function x(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// dateAdded is stored as a full ISO timestamp (sorts correctly as a plain string);
// shown here as just the date. "~" marks dates estimated during migration.
function formatDate(iso, estimated) { return iso ? (estimated ? '~' : '') + iso.slice(0, 10) : '—'; }
// Strip leading code designator (e.g. "G-31 Arc" → "Arc", "Eagle Airstrike" unchanged)
function shortName(s) { return s.replace(/^\S*\d\S* /, ''); }
const GENERIC_WEAPON_WORDS = new Set(['Pistol','Shotgun']);
function displayName(name, source) {
  const short = shortName(name);
  if (source.some(s => s !== name && shortName(s) === short)) return name; // duplicate → keep full
  if (GENERIC_WEAPON_WORDS.has(short)) return name;                        // bare type word → keep full
  return short;
}
function stratColor(name) { const c = STRATAGEM_CATS[name]; return `fp-chip-strat-${c || 'b'}`; }
const ALL_ITEMS = [...WEAPONS_LIST, ...GRENADES_LIST, ...STRATAGEMS_LIST];
const itemLabel = name => ALL_ITEMS.includes(name) ? displayName(name, ALL_ITEMS) : name;

function tagLabel(id) { const t = TAG_BY_ID[id]; return t ? `${t.icon} ${t.label}` : '#' + id; }
function tagIcon(id)  { return TAG_BY_ID[id]?.icon || ''; }
function allTags() {
  const used = new Set(rows.flatMap(r => r.tags));
  return [...TAG_DEFS.map(t => t.id).filter(id => used.has(id)),
          ...[...used].filter(id => !TAG_BY_ID[id]).sort()];
}
function allRoles() {
  return [...new Set([...ROLE_PRESETS, ...rows.map(r => r.role).filter(Boolean)])].sort();
}

function slotNames(r) {
  const s = r.slots || emptySlots();
  return [s.armor, s.booster, s.primary, s.secondary, s.grenade, ...s.stratagems].flatMap(splitAlts);
}
function haystack(r) {
  const names = slotNames(r);
  return [r.name, r.role, ...r.tags, ...r.tags.map(t => TAG_BY_ID[t]?.label || ''), ...r.factions,
          ...names, ...names.map(shortName), r.extra, r.notes].join('\n').toLowerCase();
}
function stratDupes(strats) {
  const seen = new Set(), dup = new Set();
  strats.flatMap(splitAlts).filter(s => s.toLowerCase() !== 'flex').forEach(s => seen.has(s) ? dup.add(s) : seen.add(s));
  return dup;
}

// ── Filter / sort / group ──────────────────────────────────────────────────
function visibleRows() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return rows.filter(r => {
    if (faction === 'general' && r.factions.length) return false;
    if (FACTION_HEAVIES[faction] && r.factions.length && !r.factions.includes(faction)) return false;
    for (const t of tagFilter) if (!r.tags.includes(t)) return false;
    return !q || q.split(/\s+/).every(w => haystack(r).includes(w));
  });
}

function sortRows(list) {
  const k = prefs.sortKey;
  const val = r => k === 'uses' ? (r.uses || 0) : k === 'name' ? r.name.toLowerCase() : (r[k] || r.dateAdded || '');
  const dir = k === 'name' ? 1 : -1;   // name A–Z; everything else newest / most first
  return [...list].sort((a, b) => {
    if (prefs.favFirst && a.favorite !== b.favorite) return a.favorite ? -1 : 1;
    const av = val(a), bv = val(b);
    return av < bv ? -dir : av > bv ? dir : a.name.localeCompare(b.name);
  });
}

// → [{ key, label, cls, rows }]; a row can sit in several groups (multi-faction / multi-tag)
function groupRows(list) {
  const g = prefs.groupBy;
  if (g === 'none') return [{ key: 'all', label: '', rows: list }];
  let groups;
  if (g === 'faction') {
    groups = ['bugs', 'bots', 'squids'].map(f => ({ key: f, label: { bugs: '🦟 Bugs', bots: '🤖 Bots', squids: '🦑 Squids' }[f], cls: 'group-' + f, rows: list.filter(r => r.factions.includes(f)) }));
    groups.push({ key: 'general', label: 'General', rows: list.filter(r => !r.factions.length) });
  } else if (g === 'tag') {
    groups = allTags().map(t => ({ key: 't:' + t, label: tagLabel(t), rows: list.filter(r => r.tags.includes(t)) }));
    groups.push({ key: 't:', label: 'Untagged', rows: list.filter(r => !r.tags.length) });
  } else {
    const roles = [...new Set(list.map(r => r.role).filter(Boolean))].sort();
    groups = roles.map(role => ({ key: 'r:' + role, label: role, rows: list.filter(r => r.role === role) }));
    groups.push({ key: 'r:', label: 'No role', rows: list.filter(r => !r.role) });
  }
  return groups.filter(gr => gr.rows.length);
}
function toggleGroup(key) {
  const c = new Set(prefs.collapsed);
  c.has(key) ? c.delete(key) : c.add(key);
  setPref('collapsed', [...c]);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const visible = sortRows(visibleRows());
  const groups = groupRows(visible);
  const collapsed = new Set(prefs.collapsed);
  const list = document.getElementById('list');

  if (!visible.length) {
    list.innerHTML = '<div class="empty">No loadouts match.</div>';
  } else if (prefs.view === 'cards') {
    list.innerHTML = groups.map(g => {
      const isCol = g.label && collapsed.has(g.key);
      return (g.label ? groupHead(g, isCol) : '') +
        (isCol ? '' : `<div class="cards">${g.rows.map(cardHTML).join('')}</div>`);
    }).join('');
  } else {
    list.innerHTML = `<table>
      <colgroup><col style="width:28px"><col style="width:16%"><col style="width:8%"><col style="width:9%"><col><col style="width:26%"><col style="width:104px"></colgroup>
      <thead><tr>
        <th></th>
        <th class="sortable${sortMark('name')}" onclick="headerSort('name')">Name</th>
        <th class="sortable${sortMark('dateAdded')}" onclick="headerSort('dateAdded')">Added</th>
        <th>Factions</th><th>Build</th><th>Notes</th><th></th>
      </tr></thead>
      <tbody>${groups.map(g => {
        const isCol = g.label && collapsed.has(g.key);
        return (g.label ? `<tr class="group-row"><td colspan="7">${groupHead(g, isCol)}</td></tr>` : '') +
          (isCol ? '' : g.rows.map(rowHTML).join(''));
      }).join('')}</tbody></table>`;
  }

  document.getElementById('countLabel').textContent = `${visible.length} / ${rows.length}`;
  list.querySelectorAll('details.bp').forEach(d => d.addEventListener('toggle', () => {
    d.open ? openBreakpoints.add(+d.dataset.id) : openBreakpoints.delete(+d.dataset.id);
  }));
  renderTagFilters();
}

function sortMark(k) { return prefs.sortKey === k ? (k === 'name' ? ' sort-asc' : ' sort-desc') : ''; }
function headerSort(k) { setPref('sortKey', k); }

function groupHead(g, isCol) {
  return `<div class="group-head ${g.cls || ''}${isCol ? ' collapsed' : ''}" onclick="toggleGroup('${x(g.key).replace(/'/g, "\\'")}')">
    <span class="caret">▾</span>${x(g.label)} <span class="group-count">${g.rows.length}</span></div>`;
}

function renderTagFilters() {
  const el = document.getElementById('tagFilters');
  const tags = allTags();
  for (const t of [...tagFilter]) if (!tags.includes(t)) tagFilter.delete(t);
  el.innerHTML = tags.length
    ? tags.map(t => `<button class="filter-btn tag-filter${tagFilter.has(t) ? ' active' : ''}" onclick="toggleTagFilter('${x(t)}')">${x(tagLabel(t))}</button>`).join('')
    : '<span class="ctl-label" style="text-transform:none;letter-spacing:0">none yet</span>';
}
function toggleTagFilter(t) { tagFilter.has(t) ? tagFilter.delete(t) : tagFilter.add(t); render(); }

function factionBadges(factions) {
  if (!factions.length) return '<span class="badge badge-gen">general</span>';
  return factions.map(f => `<span class="badge badge-${f}">${f}</span>`).join('');
}

function chip(name, cls = '') {
  return `<span class="chip ${cls}" title="${x(name)} — click to find loadouts using it" onclick="searchFor(this.dataset.q)" data-q="${x(shortName(name))}">${x(itemLabel(name))}</span>`;
}
function slotChips(value, clsFor) {
  return splitAlts(value).map(n => n.toLowerCase() === 'flex'
    ? '<span class="chip chip-flex">flex</span>' : chip(n, clsFor ? clsFor(n) : '')).join('<span class="chip-dim"> / </span>');
}
function slotsHTML(r) {
  const s = r.slots || emptySlots();
  const dup = stratDupes(s.stratagems);
  const stratCls = n => 'chip-strat-' + (STRATAGEM_CATS[shortName(n)] || 'b') + (dup.has(n) ? ' chip-warn' : '');

                s.booster && chip(s.booster, 'chip-dim')].filter(Boolean).join(' ');
  const strats = s.stratagems.filter(Boolean).map(v => slotChips(v, stratCls)).join(' ');
  const warn = dup.size ? `<div class="warn-line">⚠ duplicate stratagem: ${x([...dup].map(shortName).join(', '))}</div>` : '';
  return `<div class="slots">${line('Gear', gear)}${line('Kit', kit)}${line('Strats', strats)}${warn}

function nameHTML(r) {

  return `${x(r.name)}${icons ? `<span class="name-tags">${icons}</span>` : ''}${r.role ? `<span class="role-label">${x(r.role)}</span>` : ''}`;

function actionsHTML(r) {
  const weapons = loadoutWeapons(r);
  return `${weapons.length ? `<a class="btn-act" href="${calcLink(r, weapons)}" target="_blank" title="Open these weapons in the damage calc">🎯</a>` : ''}<button class="btn-act" onclick="markUsed(${r.id})" title="Log a run with this loadout${r.lastUsed ? ' — last used ' + formatDate(r.lastUsed) : ''}">✓${r.uses ? `<span class="used-count">${r.uses}</span>` : ''}</button><button class="btn-act" onclick="copyLoadout(${r.id})" title="Copy as text">📋</button><button class="btn-act" onclick="duplicateRow(${r.id})" title="Duplicate">⧉</button><button class="btn-act" onclick="openModal(${r.id})" title="Edit">✎</button>`;
}
function favBtn(r) {

function rowHTML(r) {

    <td class="col-fav">${favBtn(r)}</td>
    <td class="col-name">${nameHTML(r)}${r.tags.filter(t => !TAG_BY_ID[t]).map(t => `<span class="tag-badge">#${x(t)}</span>`).join('')}</td>

    <div class="card-foot"><span class="count" style="margin-right:auto" title="${r.dateEstimated ? 'Estimated' : ''}">${formatDate(r.dateAdded, r.dateEstimated)}</span>${actionsHTML(r)}</div>
  </div>`;

function searchFor(q) {

// ── Sort & Filter ──────────────────────────────────────────────────────────
function setFaction(btn) {
  faction = btn.dataset.faction;
  document.querySelectorAll('.filter-btn[data-faction]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

// ── Quick actions ──────────────────────────────────────────────────────────
function updateRow(id, fn) {
  const r = rows.find(r => r.id === id);
  if (!r) return;
  fn(r);
  persist(rows);
  render();
}
function toggleFav(id) { updateRow(id, r => { r.favorite = !r.favorite; }); }
function markUsed(id)  { updateRow(id, r => { r.uses = (r.uses || 0) + 1; r.lastUsed = new Date().toISOString(); }); }
function nextId() { return rows.reduce((m, r) => Math.max(m, r.id), 0) + 1; }
function duplicateRow(id) {
  const src = rows.find(r => r.id === id);
  if (!src) return;
  const now = new Date().toISOString();
  const copy = { ...structuredClone(src), id: nextId(), name: src.name + ' (copy)', favorite: false,
                 dateAdded: now, updatedAt: now, uses: 0 };
  delete copy.lastUsed; delete copy.dateEstimated; delete copy.buildOriginal;
  rows.push(copy);
  persist(rows);
  render();
  openModal(copy.id);
}

function loadoutText(r) {
  const s = r.slots || emptySlots();
  const lbl = v => splitAlts(v).map(itemLabel).join(' / ');
  const lines = [`${r.name}${r.role ? ` (${r.role})` : ''} — ${r.factions.length ? r.factions.join(', ') : 'any faction'}`];
  if (s.armor || s.booster) lines.push([s.armor && `Armor: ${s.armor}`, s.booster && `Booster: ${s.booster}`].filter(Boolean).join(' · '));
  const kit = [s.primary, s.secondary, s.grenade].filter(Boolean).map(lbl);
  if (kit.length) lines.push(kit.join(' · '));
  const strats = s.stratagems.filter(Boolean).map(lbl);
  if (strats.length) lines.push('Stratagems: ' + strats.join(', '));
  if (r.extra) lines.push(r.extra);
  if (r.notes) lines.push('', r.notes);
  return lines.join('\n');
}
async function copyLoadout(id) {
  const r = rows.find(r => r.id === id);
  if (!r) return;
  try { await navigator.clipboard.writeText(loadoutText(r)); flash('Copied to clipboard'); }
  catch { prompt('Copy:', loadoutText(r)); }
}
function flash(msg) {
  const el = document.getElementById('countLabel');
  const prev = el.textContent;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = prev; }, 1500);
}

// ── Faction boards ─────────────────────────────────────────────────────────────
const BOARDS_KEY = LS_KEY + '_boards';
const BOARD_ROWS = [
  { key: 'weapons',    label: 'Weapons',    source: () => WEAPONS_LIST    },
  { key: 'grenades',   label: 'Grenades',   source: () => GRENADES_LIST   },
  { key: 'stratagems', label: 'Stratagems', source: () => STRATAGEMS_LIST },
];

function loadBoards() { try { return JSON.parse(localStorage.getItem(BOARDS_KEY) || '{}'); } catch { return {}; } }
function saveBoards() { localStorage.setItem(BOARDS_KEY, JSON.stringify(boards)); fsWrite(rows); }

let boards = loadBoards();
let dragState = null;

function clearDragIndicators() {
  document.querySelectorAll('.fp-chip.drag-left,.fp-chip.drag-right')
    .forEach(c => c.classList.remove('drag-left','drag-right'));
}
function attachChipDrag(chip) {
  chip.draggable = true;
  chip.addEventListener('dragstart', e => {
    dragState = { key: chip.dataset.key, fromIdx: parseInt(chip.dataset.idx) };
    chip.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  chip.addEventListener('dragend', () => {
    chip.classList.remove('dragging');
    clearDragIndicators();
    dragState = null;
  });
  chip.addEventListener('dragover', e => {
    if (!dragState || dragState.key !== chip.dataset.key) return;
    e.preventDefault();
    clearDragIndicators();
    const rect = chip.getBoundingClientRect();
    chip.classList.add(e.clientX > rect.left + rect.width / 2 ? 'drag-right' : 'drag-left');
  });
  chip.addEventListener('dragleave', e => {
    if (!chip.contains(e.relatedTarget)) chip.classList.remove('drag-left','drag-right');
  });
  chip.addEventListener('drop', e => {
    e.preventDefault();
    clearDragIndicators();
    if (!dragState || chip.dataset.key !== dragState.key) return;
    const fromIdx = dragState.fromIdx;
    const toIdx = parseInt(chip.dataset.idx);
    const rect = chip.getBoundingClientRect();
    let insertIdx = e.clientX > rect.left + rect.width / 2 ? toIdx + 1 : toIdx;
    const arr = boards[faction][dragState.key];
    const [item] = arr.splice(fromIdx, 1);
    if (insertIdx > fromIdx) insertIdx--;
    arr.splice(insertIdx, 0, item);
    saveBoards();
    renderPanel();
  });
}
// Migrate old array-based data
for (const f of ['bugs','bots','squids']) { if (Array.isArray(boards[f])) boards[f] = {}; }

function renderPanel() {
  const panel = document.getElementById('factionPanel');
  if (faction === 'all') { panel.innerHTML = ''; return; }
  const fc = faction;
  const fData = boards[fc] || {};
  let html = `<div class="fp-wrap fp-${fc}">`;
  BOARD_ROWS.forEach(row => {
    const items = fData[row.key] || [];
    html += `<div class="fp-row" id="fp-row-${row.key}">
      <span class="fp-label">${row.label}</span>
      <div class="fp-chips" id="fp-chips-${row.key}">
        ${items.map((item, idx) =>
          `<span class="fp-chip ${row.key === 'stratagems' ? stratColor(item) : 'fp-chip-' + fc}" data-key="${row.key}" data-idx="${idx}">${x(item)}<button class="fp-chip-remove" data-key="${row.key}" data-idx="${idx}">×</button></span>`
        ).join('')}
        <button class="fp-add-item" data-key="${row.key}">+ item</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.fp-chip-remove').forEach(btn =>
    btn.addEventListener('click', () => removeBoardChip(btn.dataset.key, parseInt(btn.dataset.idx))));
  panel.querySelectorAll('.fp-add-item').forEach(btn =>
    btn.addEventListener('click', () => startAddItem(btn.dataset.key)));
  panel.querySelectorAll('.fp-chip[data-key]').forEach(chip => attachChipDrag(chip));
}

function startAddItem(key) {
  // Close any already-open search
  document.getElementById('fp-search-active')?.remove();

  const rowEl = document.getElementById(`fp-row-${key}`);
  if (!rowEl) return;
  const source = BOARD_ROWS.find(r => r.key === key)?.source() || [];
  const existing = new Set((boards[faction]?.[key] || []));

  const searchDiv = document.createElement('div');
  searchDiv.id = 'fp-search-active';
  searchDiv.className = 'fp-search-row';

  const input = document.createElement('input');
  input.type = 'text'; input.className = 'fp-input'; input.placeholder = `Search ${key}…`;

  const dropdown = document.createElement('div');
  dropdown.className = 'fp-dropdown';

  searchDiv.appendChild(input);
  searchDiv.appendChild(dropdown);
  rowEl.after(searchDiv);

  function refreshDropdown() {
    const q = input.value.toLowerCase();
    const results = source.filter(s => !existing.has(s) && (!q || s.toLowerCase().includes(q)));
    dropdown.innerHTML = results.length
      ? results.map(s => `<button class="fp-option">${x(displayName(s, source))}</button>`).join('')
      : `<div class="fp-option-empty">No matches</div>`;
    dropdown.querySelectorAll('.fp-option').forEach(btn =>
      btn.addEventListener('mousedown', e => { e.preventDefault(); selectItem(btn.textContent); }));
  }

  function selectItem(name) {
    if (!boards[faction]) boards[faction] = {};
    if (!boards[faction][key]) boards[faction][key] = [];
    if (!boards[faction][key].includes(name)) {
      boards[faction][key].push(name);
      saveBoards();
      existing.add(name);
      // Append chip inline without full re-render
      const chipsDiv = document.getElementById(`fp-chips-${key}`);
      if (chipsDiv) {
        const idx = boards[faction][key].length - 1;
        const chip = document.createElement('span');
        chip.className = `fp-chip ${key === 'stratagems' ? stratColor(name) : 'fp-chip-' + faction}`;
        chip.dataset.key = key; chip.dataset.idx = String(idx);
        const rm = document.createElement('button');
        rm.className = 'fp-chip-remove'; rm.textContent = '×';
        rm.dataset.key = key; rm.dataset.idx = String(idx);
        rm.addEventListener('click', () => removeBoardChip(key, parseInt(rm.dataset.idx)));
        chip.append(document.createTextNode(name), rm);
        const addBtn = chipsDiv.querySelector('.fp-add-item');
        chipsDiv.insertBefore(chip, addBtn ?? null);
        attachChipDrag(chip);
      }
    }
    input.value = ''; refreshDropdown(); input.focus();
  }

  refreshDropdown();
  input.addEventListener('input', refreshDropdown);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchDiv.remove(); }
    else if (e.key === 'Enter') { const first = dropdown.querySelector('.fp-option'); if (first) first.dispatchEvent(new MouseEvent('mousedown')); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); dropdown.querySelector('.fp-option')?.focus(); }
  });
  dropdown.addEventListener('keydown', e => {
    const opts = [...dropdown.querySelectorAll('.fp-option')];
    const i = opts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); opts[i+1]?.focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); i > 0 ? opts[i-1].focus() : input.focus(); }
    else if (e.key === 'Enter' && i >= 0) { e.preventDefault(); opts[i].dispatchEvent(new MouseEvent('mousedown')); input.focus(); }
    else if (e.key === 'Escape') { searchDiv.remove(); }
  });

  // Close on outside click
  setTimeout(() => {
    function outsideClick(e) { if (!searchDiv.contains(e.target)) { searchDiv.remove(); document.removeEventListener('mousedown', outsideClick); } }
    document.addEventListener('mousedown', outsideClick);
  }, 0);

  input.focus();
}

function removeBoardChip(key, idx) {
  document.getElementById('fp-search-active')?.remove();
  const data = boards[faction]?.[key];
  if (!data) return;
  data.splice(idx, 1);
  saveBoards();
  renderPanel();
}

// ── Modal ──────────────────────────────────────────────────────────────────
const SLOT_FIELDS = { armor: 'fArmor', booster: 'fBooster', primary: 'fPrimary', secondary: 'fSecondary', grenade: 'fGrenade' };
const $ = id => document.getElementById(id);

function openModal(id) {
  editId = id || null;
  $('modalTitle').textContent = id ? 'Edit Loadout' : 'Add Loadout';
  $('btnDelete').style.display = id ? 'block' : 'none';
  $('fName').classList.remove('error');

  const r = id ? rows.find(r => r.id === id) : null;
  const s = r?.slots || emptySlots();
  $('fName').value     = r ? r.name : '';
  $('fRole').value     = r?.role || '';
  $('fFav').checked    = !!r?.favorite;
  $('fBugs').checked   = !!r?.factions.includes('bugs');
  $('fBots').checked   = !!r?.factions.includes('bots');
  $('fSquids').checked = !!r?.factions.includes('squids');
  for (const [k, el] of Object.entries(SLOT_FIELDS)) $(el).value = s[k] || '';
  s.stratagems.forEach((v, i) => { $('fStrat' + i).value = v || ''; });
  $('fExtra').value = r?.extra || '';
  $('fNotes').value = r?.notes || '';
  editTags = [...(r?.tags || [])];
  $('dl-role').innerHTML = allRoles().map(v => `<option value="${x(v)}">`).join('');
  renderTagPicks();
  renderOrigBuild(r);
  checkStratDupes();

  const bits = [];
  if (r?.dateAdded) bits.push(`Added ${formatDate(r.dateAdded, r.dateEstimated)}`);
  if (r?.updatedAt) bits.push(`edited ${formatDate(r.updatedAt)}`);
  if (r?.uses) bits.push(`used ${r.uses}× (last ${formatDate(r.lastUsed)})`);
  $('modalDateAdded').textContent = bits.join(' · ');

  $('overlay').classList.add('open');
  setTimeout(() => $('fName').focus(), 50);
}

function renderTagPicks() {
  const ids = [...new Set([...TAG_DEFS.map(t => t.id), ...allTags(), ...editTags])];
  $('fTags').innerHTML = ids.map(t =>
    `<button type="button" class="tag-pick${editTags.includes(t) ? ' on' : ''}" onclick="toggleEditTag('${x(t)}')">${x(tagLabel(t))}</button>`
  ).join('') + `<input type="text" id="fNewTag" placeholder="+ new tag" onkeydown="newTagKey(event)">`;
}
function toggleEditTag(t) {
  editTags = editTags.includes(t) ? editTags.filter(e => e !== t) : [...editTags, t];
  renderTagPicks();
}
function newTagKey(e) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  addNewTag();
}
function addNewTag() {
  const el = $('fNewTag');
  const t = el && el.value.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
  if (t && !editTags.includes(t)) editTags.push(t);
  renderTagPicks();
  $('fNewTag').focus();
}

function renderOrigBuild(r) {
  const el = $('origBuild');
  el.innerHTML = r?.buildOriginal ? `<details><summary>Original build text (before slots)</summary>
      <pre>${x(r.buildOriginal)}</pre>
      <button type="button" class="btn-cancel" onclick="discardOrigBuild()">Discard original text</button></details>` : '';
}
function discardOrigBuild() {
  const r = rows.find(r => r.id === editId);
  if (r) { delete r.buildOriginal; persist(rows); renderOrigBuild(r); }
}

function checkStratDupes() {
  const dup = stratDupes([0, 1, 2, 3].map(i => $('fStrat' + i).value.trim()));
  $('stratWarn').textContent = dup.size ? `⚠ duplicate stratagem: ${[...dup].map(shortName).join(', ')}` : '';
}

function closeModal() {
  $('overlay').classList.remove('open');
  editId = null;
}

function overlayClick(e) {
  if (e.target === $('overlay')) closeModal();
}

function saveRow() {
  const name = $('fName').value.trim();
  if (!name) { $('fName').classList.add('error'); $('fName').focus(); return; }
  if ($('fNewTag')?.value.trim()) addNewTag();   // don't lose a half-typed tag

  const slots = emptySlots();
  for (const [k, el] of Object.entries(SLOT_FIELDS)) slots[k] = $(el).value.trim();
  slots.stratagems = [0, 1, 2, 3].map(i => $('fStrat' + i).value.trim());
  const fields = {
    name,
    role: $('fRole').value.trim(),
    favorite: $('fFav').checked,
    factions: ['bugs', 'bots', 'squids'].filter(f => $('f' + f[0].toUpperCase() + f.slice(1)).checked),
    tags: editTags,
    slots,
    extra: $('fExtra').value.trim(),
    notes: $('fNotes').value,
    updatedAt: new Date().toISOString(),
    schema: SCHEMA,
  };

  if (editId) {
    const i = rows.findIndex(r => r.id === editId);
    rows[i] = { ...rows[i], ...fields };
  } else {
    rows.push({ id: nextId(), ...fields, uses: 0, dateAdded: fields.updatedAt });
  }

  persist(rows);
  render();
  closeModal();
}

function deleteRow() {
  if (!editId || !confirm('Delete this loadout?')) return;
  rows = rows.filter(r => r.id !== editId);
  persist(rows);
  render();
  closeModal();
}

// ── Import / export ────────────────────────────────────────────────────────
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportJSON() {
  const data = { app: 'hd2-loadouts', schema: SCHEMA, exportedAt: new Date().toISOString(), rows, boards };
  download(`loadouts-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
}

async function importJSON(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { alert('That file isn’t valid JSON.'); return; }
  const fileRows = Array.isArray(data) ? data : data.rows;
  if (!Array.isArray(fileRows)) { alert('No loadouts found in that file.'); return; }
  if (!confirm(`Replace your ${rows.length} loadouts with the ${fileRows.length} in “${file.name}”?` +
               (data.boards ? '\nFaction boards will be replaced too.' : ''))) return;
  rows = migrateAll(fileRows);
  if (data.boards) { boards = data.boards; localStorage.setItem(BOARDS_KEY, JSON.stringify(boards)); renderPanel(); }
  persist(rows);
  render();
}

// Standalone copy of this page with the current loadouts baked in as SEED
// (hd-calc.js must sit next to it for breakpoints to show).
function exportHTML() {
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  html = html.replace(/<div id="list">[\s\S]*?<div class="notes-block">/, '<div id="list"></div>\n\n<div class="notes-block">');
  const newSeed = JSON.stringify(rows, null, 4);
  html = html.replace(
    /\/\/ SEED_BEGIN\n[\s\S]*?\/\/ SEED_END/,
    () => `// SEED_BEGIN\nconst SEED = ${newSeed};\n// SEED_END`
  );
  download('loadouts.html', html, 'text/html; charset=utf-8');
}

// ── Keyboard ───────────────────────────────────────────────────────────────
// Ctrl/Cmd+Enter saves — plain Enter is left alone so slot suggestions can be picked.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('overlay').classList.contains('open')) saveRow();
});

// ── Init ───────────────────────────────────────────────────────────────────
function fillDatalists() {
  const fill = (id, items) => { $(id).innerHTML = items.map(v => `<option value="${x(v)}">`).join(''); };
  fill('dl-armor', ARMOR_SUGGESTIONS);
  fill('dl-primary', PRIMARIES);
  fill('dl-secondary', SECONDARIES);
  fill('dl-grenade', GRENADES_LIST);
  fill('dl-strat', [...STRATAGEMS_LIST, 'Flex']);
  fill('dl-booster', BOOSTERS);
  fill('dl-role', allRoles());
}

fillDatalists();
syncControls();
render();
renderPanel();
initFS();  // async — loads from file if handle stored, re-renders if data differs
</script>
